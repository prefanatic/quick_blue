<!--
  D-Bus system-bus policy for quick_blue's Linux implementation.

  quick_blue_linux serializes per-engine connections by owning well-known bus
  names under `dev.quick_blue.Connection.*` on the *system* bus
  (see lib/quick_blue_linux_dart.dart). Distributions whose system bus denies name
  ownership by default (e.g. Fedora) make every connect() fail with:

      org.freedesktop.DBus.Error.AccessDenied:
      Request to own name refused by policy

  Install for the user that runs the application, replacing RUN_AS_USER with
  that user's name:

      sed "s/RUN_AS_USER/$USER/" quick_blue_linux/dbus/dev.quick_blue.Connection.conf \
        | sudo tee /usr/share/dbus-1/system.d/dev.quick_blue.Connection.conf >/dev/null
      sudo systemctl reload dbus-broker   # or: sudo systemctl restart dbus

  Multi-user hosts can grant a shared group instead by replacing the
  <policy user="..."> element with <policy group="bluetooth">.

  Verify ownership is permitted:

      busctl call org.freedesktop.DBus /org/freedesktop/DBus \
        org.freedesktop.DBus RequestName su dev.quick_blue.Connection.p0.d0 0
      # -> "u 1" means permitted
-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="RUN_AS_USER">
    <allow own_prefix="dev.quick_blue.Connection"/>
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
